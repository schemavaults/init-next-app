services:
  postgres:
    image: postgres:17.7
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xxx_project_name_xxx
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-ws-proxy:
    image: ghcr.io/schemavaults/dbh/postgres-ws-proxy:xxx_dbh_version_xxx
    ports:
      - "5433:5433"
    environment:
      PGHOST: postgres
      PGPORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  # mould:if blob_storage == s3
  # S3-compatible object storage (RustFS) for development. S3 API on :9000;
  # web console on http://localhost:9001/rustfs/console/ (sign in with the
  # access/secret key below).
  s3:
    image: rustfs/rustfs:1.0.1
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: s3-dev-access-key
      RUSTFS_SECRET_KEY: s3-dev-secret-key
      # Not read by RustFS: the bucket the healthcheck below provisions
      S3_BUCKET: dev-bucket
    volumes:
      - s3-data:/data
    # Healthy once S3_BUCKET exists. The check creates the bucket when it is
    # missing (first start, or after `docker compose down -v`); a one-shot
    # init container would instead stop `bun run e2e`, which aborts as soon
    # as any container exits.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fs -o /dev/null -I --aws-sigv4 aws:amz:us-east-1:s3
          -u "$$RUSTFS_ACCESS_KEY:$$RUSTFS_SECRET_KEY" "http://localhost:9000/$$S3_BUCKET" ||
          curl -fs -o /dev/null -X PUT --aws-sigv4 aws:amz:us-east-1:s3
          -u "$$RUSTFS_ACCESS_KEY:$$RUSTFS_SECRET_KEY" "http://localhost:9000/$$S3_BUCKET"
      interval: 5s
      timeout: 5s
      retries: 5

  # mould:endif
  app:
    build:
      context: .
      args:
        SCHEMAVAULTS_CLIENT_APP_ID: ${SCHEMAVAULTS_CLIENT_APP_ID}
        SCHEMAVAULTS_API_SERVER_ID: ${SCHEMAVAULTS_API_SERVER_ID}
        SCHEMAVAULTS_AUTH_SERVER_URL: ${SCHEMAVAULTS_AUTH_SERVER_URL:-https://auth.schemavaults.com}
    container_name: xxx_project_name_xxx
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    # mould:if blob_storage == s3
    # Use the local `s3` service, overriding any S3_* in .env.production
    environment:
      S3_ENDPOINT: http://s3:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: s3-dev-access-key
      S3_SECRET_ACCESS_KEY: s3-dev-secret-key
      S3_BUCKET: dev-bucket
      S3_FORCE_PATH_STYLE: "true"
    # mould:endif
    depends_on:
      postgres-ws-proxy:
        condition: service_started
      # mould:if blob_storage == s3
      s3:
        condition: service_healthy
      # mould:endif
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  cypress:
    image: cypress/included:xxx_cypress_version_xxx
    working_dir: /e2e
    volumes:
      - ./cypress:/e2e/cypress
      - ./cypress.config.ts:/e2e/cypress.config.ts:ro
    environment:
      CYPRESS_baseUrl: http://app:3000
    depends_on:
      app:
        condition: service_healthy
    profiles:
      - e2e
# mould:if blob_storage == s3

volumes:
  s3-data:
# mould:endif
