name: CI

on:
  push:
    branches:
      - main
      - "feature/*"
      - "claude/*"
      - "fix/*"
  pull_request:

env:
  BUN_VERSION: 1.4.2

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SCHEMAVAULTS_APP_ENVIRONMENT: production
      SCHEMAVAULTS_AUTH_SERVER_URL: https://auth.schemavaults.com

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: API route files match the operations catalogue
        run: bun run openapi:check

      - name: Build
        run: bun run build

  # Jobs can't read secrets in `if:`, so this job checks for the database
  # credentials @schemavaults/dbh connects with (POSTGRES_URL, or the
  # POSTGRES_HOST/DATABASE/USER/PASSWORD it builds one from) and `migrate` is
  # skipped until any of them is a repository secret. A partial set still runs
  # `migrate`, so dbh fails naming the missing ones.
  database-credentials:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      configured: ${{ steps.check.outputs.configured }}

    steps:
      - name: Check for database credentials
        id: check
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_DATABASE: ${{ secrets.POSTGRES_DATABASE }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          if [ -n "$POSTGRES_URL$POSTGRES_HOST$POSTGRES_DATABASE$POSTGRES_USER$POSTGRES_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipping migrate::No database credentials are set. Add a POSTGRES_URL repository secret (or POSTGRES_HOST, POSTGRES_DATABASE, POSTGRES_USER and POSTGRES_PASSWORD) to run production migrations."
          fi

  migrate:
    needs: [build, database-credentials]
    if: needs.database-credentials.outputs.configured == 'true'
    uses: ./.github/workflows/migrate-production.yml
    secrets: inherit

  # mould:if deployment == vercel
  publish-to-vercel:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install

      - name: Install Vercel CLI
        run: bun add -g vercel@latest

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy project artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  # mould:endif
